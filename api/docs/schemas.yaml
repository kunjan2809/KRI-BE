    - success
    - message
    - data

# Success Response
SuccessResponse:
  type: object
  properties:
    success:
      type: boolean
      description: Operation success status
      example: true
    message:
      type: string
      description: Success message
      example: "Operation completed successfully"
    data:
      type: object
      description: Response data (varies by endpoint)
  required:
    - success
    - message

# Error Response
ErrorResponse:
  type: object
  properties:
    success:
      type: boolean
      description: Operation success status
      example: false
    message:
      type: string
      description: Error message
      example: "An error occurred"
