# Product List Response Schema
ProductListResponse:
  type: object
  properties:
    success:
      type: boolean
      description: Operation success status
      example: true
    data:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProductWithPrimaryImage'
          description: List of products with primary images
        pagination:
          type: object
          properties:
            current_page:
              type: integer
              description: Current page number
              example: 1
            total_pages:
              type: integer
              description: Total number of pages
              example: 5
            total_products:
              type: integer
              description: Total number of products
              example: 100
            limit:
              type: integer
              description: Products per page
              example: 20
          required:
            - current_page
            - total_pages
            - total_products
            - limit
        filters:
          type: object
          properties:
            stock_filters:
              type: array
              items:
                type: string
                enum: ['in_stock', 'low_stock', 'out_of_stock']
              description: Applied stock filters
              example: ["in_stock", "low_stock"]
            status_filters:
              type: array
              items:
                type: string
                enum: ['published', 'draft']
              description: Applied status filters
              example: ["published"]
            search:
              type: string
              description: Search term used
              example: "iphone"
        sorting:
          type: object
          properties:
            sort_by:
              type: string
              description: Field used for sorting
              example: "created_at"
            sort_order:
              type: string
              enum: ['asc', 'desc']
              description: Sort order
              example: "desc"
      required:
        - products
        - pagination
        - filters
        - sorting
  required:
    - success
    - data

# Product Details Response Schema
ProductDetailsResponse:
  type: object
  properties:
    success:
      type: boolean
      description: Operation success status
      example: true
    data:
      type: object
      properties:
        product:
          $ref: '#/components/schemas/ProductWithImages'
        reviews:
          $ref: '#/components/schemas/ReviewData'
      required:
        - product
        - reviews
  required:
    - success
    - data

