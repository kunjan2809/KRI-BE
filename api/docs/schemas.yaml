# Product Status Update Response Schema
ProductStatusUpdateResponse:
  type: object
  properties:
    success:
      type: boolean
      description: Operation success status
      example: true
    message:
      type: string
      description: Success message
      example: "Product status updated successfully"
    data:
      type: object
      properties:
        product_id:
          type: string
          description: Product ID
          example: "507f1f77bcf86cd799439011"
