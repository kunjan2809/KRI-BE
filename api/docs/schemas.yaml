      type: boolean
      description: Whether the product is featured
      default: false
      example: true
    final_price:
      type: number
      description: Final price after discount
      example: 999.99
    discount_amount:
      type: number
      description: Amount of discount
      example: 0
    in_stock:
      type: boolean
      description: Whether product is in stock
      example: true
    low_stock:
      type: boolean
      description: Whether product has low stock
      example: false
    is_deleted:
      type: boolean
      description: Whether product is soft-deleted
      example: false
    created_at:
      type: string
      format: date-time
      description: Product creation timestamp
      example: "2024-01-15T10:30:00.000Z"
    edited_at:
      type: string
      format: date-time
      description: Product last update timestamp
      example: "2024-01-15T10:30:00.000Z"
    images:
      type: array
      items:
