          description: JWT authentication token
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDdmMWY3N2JjZjg2Y2Q3OTk0MzkwMTEiLCJpYXQiOjE1NDQ5NzE4MDAsImV4cCI6MTU0NTU3NjYwMH0.example"
      required:
        - user
        - token
  required:
    - success
    - message
    - data

# Profile Response
ProfileResponse:
  type: object
  properties:
    success:
      type: boolean
      description: Operation success status
      example: true
    data:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
      required:
        - user
  required:
    - success
    - data

# Order Schema
Order:
  type: object
  properties:
    _id:
      type: string
      description: Unique order identifier
      example: "507f1f77bcf86cd799439011"
    user_id:
      $ref: '#/components/schemas/User'
    shipping_address_id:
      $ref: '#/components/schemas/ShippingAddress'
    order_status:
      type: string
      enum: ['pending', 'shipped', 'cancelled', 'delivered', 'return']
      description: Current status of the order
      example: "pending"
    delivered_at:
      type: string
      format: date-time
      description: When order was delivered (if applicable)
      example: null
    payment_status:
      type: string
      enum: ['paid', 'cod', 'unpaid', 'refunded']
      description: Current payment status
      example: "unpaid"
    discount_type:
      type: string
      enum: ['price', 'percentage', null]
      description: Type of discount applied to order
      example: null
    discount_rate:
      type: number
      description: Discount rate value
      example: 0
    total_amount:
      type: number
      description: Total order amount
      example: 299.99
    delivery:
      $ref: '#/components/schemas/Delivery'
      description: Delivery information (if available)
    created_at:
      type: string
      format: date-time
      description: Order creation timestamp
      example: "2024-01-15T10:30:00.000Z"
  required:
    - _id
    - user_id
    - shipping_address_id
    - order_status
    - payment_status
    - total_amount

# Order Item Schema
OrderItem:
  type: object
  properties:
    _id:
      type: string
      description: Unique order item identifier
      example: "507f1f77bcf86cd799439011"
    order_id:
      type: string
      description: Order ID this item belongs to
      example: "507f1f77bcf86cd799439011"
    product_id:
      type: string
      description: Product ID
      example: "507f1f77bcf86cd799439011"
    product_name_snapshot:
      type: string
      description: Product name when order was placed
      example: "iPhone 15 Pro"
    product_price_snapshot:
      type: number
      description: Product price when order was placed
      example: 999.99
    quantity:
      type: integer
      description: Quantity ordered
      example: 2
    price:
      type: number
      description: Final price for this item
      example: 1999.98
  required:
    - _id
    - order_id
    - product_id
    - product_name_snapshot
    - product_price_snapshot
    - quantity
    - price 