# Review Summary Schema
ReviewSummary:
  type: object
  properties:
    averageRating:
      type: number
      description: Average rating for the product
      minimum: 0
      maximum: 5
      example: 4.2
    totalReviews:
      type: integer
      description: Total number of reviews
      minimum: 0
      example: 15

# Review Data Schema
ReviewData:
  type: object
  properties:
    summary:
      $ref: '#/components/schemas/ReviewSummary'
    details:
      type: array
      items:
        $ref: '#/components/schemas/ProductReview'
      description: List of review details with images

# Product with Images Schema
ProductWithImages:
