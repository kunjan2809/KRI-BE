# Order Endpoints for E-Commerce API
# This file contains order management endpoints

openapi: 3.0.0
info:
  title: E-Commerce Order Endpoints
  version: 1.0.0
  description: Order management endpoints for creating orders, viewing order history, and admin order management

components:
  schemas:
    # Reference schemas from the main schemas file
    User:
      $ref: './schemas.yaml#/User'
    ShippingAddress:
      $ref: './schemas.yaml#/ShippingAddress'
    Order:
      $ref: './schemas.yaml#/Order'
    OrderItem:
      $ref: './schemas.yaml#/OrderItem'
    Delivery:
      $ref: './schemas.yaml#/Delivery'
    ErrorResponse:
      $ref: './schemas.yaml#/ErrorResponse'
    SuccessResponse:
      $ref: './schemas.yaml#/SuccessResponse'

tags:
  - name: Orders
    description: Order management and tracking endpoints

paths:
  # ========================================
  # ORDER ENDPOINTS
  # ========================================

  /api/orders/create:
    post:
      summary: Create a new order (Public)
      description: Create a new order as draft. No authentication required. Customer info is collected and user is created if doesn't exist. Returns complete order with populated shipping address and product details.
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_info:
                  type: object
                  properties:
                    first_name:
                      type: string
                      description: Customer's first name
                      example: "John"
                    last_name:
                      type: string
                      description: Customer's last name
                      example: "Doe"
                    email:
                      type: string
                      format: email
                      description: Customer's email address
                      example: "john.doe@example.com"
                    mobile_number:
                      type: string
                      description: Customer's mobile number
                      example: "+1234567890"
                  required:
                    - first_name
                    - last_name
                    - email
                    - mobile_number
                shipping_address_id:
                  type: string
                  description: ID of the shipping address
                  example: "507f1f77bcf86cd799439011"
                products:
                  type: array
                  items:
                    type: object
                    properties:
                      product_id:
                        type: string
                        description: Product ID to order
                        example: "507f1f77bcf86cd799439011"
                      quantity:
                        type: integer
                        minimum: 1
                        description: Quantity of the product
                        example: 2
                  minItems: 1
                  description: Array of products with quantities
              required:
                - customer_info
                - shipping_address_id
                - products
            examples:
              example1:
                summary: Basic order creation
                value:
                  customer_info:
                    first_name: "John"
                    last_name: "Doe"
                    email: "john.doe@example.com"
                    mobile_number: "+1234567890"
                  shipping_address_id: "507f1f77bcf86cd799439011"
                  products:
                    - product_id: "507f1f77bcf86cd799439011"
                      quantity: 2
                    - product_id: "507f1f77bcf86cd799439012"
                      quantity: 1
      responses:
        '201':
          description: Order created successfully as draft
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Order created successfully as draft"
                  data:
                    type: object
                    properties:
                      order:
                        $ref: '#/components/schemas/Order'
                      order_items:
                        type: array
                        items:
                          $ref: '#/components/schemas/OrderItem'
        '400':
          description: Bad request - validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingFields:
                  summary: Missing required fields
                  value:
                    success: false
                    message: "Customer info, shipping address, and products are required"
                insufficientStock:
                  summary: Insufficient stock
                  value:
                    success: false
                    message: "Insufficient stock for product Product Name. Available: 5, Requested: 10"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orders/user-orders:
    get:
      summary: Get user order history (Authenticated)
      description: Retrieve all orders for the authenticated user. Requires valid JWT token. Returns complete order details including populated shipping address, product information, and delivery details (if available).
      tags: [Orders]
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number for pagination
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          example: 1
        - name: limit
          in: query
          description: Number of orders per page
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
          example: 10
      responses:
        '200':
          description: User orders retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      orders:
                        type: array
                        items:
                          $ref: '#/components/schemas/Order'
                      pagination:
                        type: object
                        properties:
                          current_page:
                            type: integer
                            example: 1
                          total_pages:
                            type: integer
                            example: 5
                          total_orders:
                            type: integer
                            example: 50
                          limit:
                            type: integer
                            example: 10
        '401':
          description: Unauthorized - missing or invalid JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orders/admin/all:
    get:
      summary: Get all orders (Admin only)
      description: Retrieve all orders with advanced filtering, pagination, and search. Admin access required. Returns complete order details including customer info, shipping address, product details, and delivery information (if available).
      tags: [Orders]
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number for pagination
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          example: 1
        - name: limit
          in: query
          description: Number of orders per page
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          example: 20
        - name: status
          in: query
          description: Filter by order status
          required: false
          schema:
            type: string
            enum: ['pending', 'shipped', 'cancelled', 'delivered', 'return']
          example: "pending"
        - name: payment_status
          in: query
          description: Filter by payment status
          required: false
          schema:
            type: string
            enum: ['paid', 'cod', 'unpaid', 'refunded']
          example: "unpaid"
        - name: start_date
          in: query
          description: Filter orders from this date (YYYY-MM-DD)
          required: false
          schema:
            type: string
            format: date
          example: "2024-01-01"
        - name: end_date
          in: query
          description: Filter orders until this date (YYYY-MM-DD)
          required: false
          schema:
            type: string
            format: date
          example: "2024-12-31"
        - name: search
          in: query
          description: Search by order ID, customer name, or address
          required: false
          schema:
            type: string
          example: "john"
        - name: sort_by
          in: query
          description: Field to sort by
          required: false
          schema:
            type: string
            enum: ['created_at', 'total_amount', 'order_status']
            default: "created_at"
          example: "created_at"
        - name: sort_order
          in: query
          description: Sort order
          required: false
          schema:
            type: string
            enum: ['asc', 'desc']
            default: "desc"
          example: "desc"
      responses:
        '200':
          description: All orders retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      orders:
                        type: array
                        items:
                          $ref: '#/components/schemas/Order'
                      pagination:
                        type: object
                        properties:
                          current_page:
                            type: integer
                            example: 1
                          total_pages:
                            type: integer
                            example: 10
                          total_orders:
                            type: integer
                            example: 200
                          limit:
                            type: integer
                            example: 20
                      filters:
                        type: object
                        properties:
                          status:
                            type: string
                            example: "pending"
                          payment_status:
                            type: string
                            example: "unpaid"
                          start_date:
                            type: string
                            example: "2024-01-01"
                          end_date:
                            type: string
                            example: "2024-12-31"
                          search:
                            type: string
                            example: "john"
                      sorting:
                        type: object
                        properties:
                          sort_by:
                            type: string
                            example: "created_at"
                          sort_order:
                            type: string
                            example: "desc"
        '401':
          description: Unauthorized - missing or invalid JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orders/admin/details/{orderId}:
    get:
      summary: Get complete order details (Admin only)
      description: Retrieve complete order details by order ID. Admin access required. Returns all order information, user data, shipping address, order items with product details, and delivery information.
      tags: [Orders]
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          description: Order ID to fetch details for
          required: true
          schema:
            type: string
          example: "507f1f77bcf86cd799439011"
      responses:
        '200':
          description: Order details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      order:
                        type: object
                        properties:
                          _id:
                            type: string
                            example: "507f1f77bcf86cd799439011"
                          order_status:
                            type: string
                            example: "pending"
                          delivered_at:
                            type: string
                            format: date-time
                            example: null
                          payment_status:
                            type: string
                            example: "unpaid"
                          discount_type:
                            type: string
                            example: null
                          discount_rate:
                            type: number
                            example: 0
                          total_amount:
                            type: number
                            example: 299.99
                          created_at:
                            type: string
                            format: date-time
                            example: "2024-01-15T10:30:00.000Z"
                      user:
                        $ref: '#/components/schemas/User'
                      shipping_address:
                        $ref: '#/components/schemas/ShippingAddress'
                      order_items:
                        type: array
                        items:
                          $ref: '#/components/schemas/OrderItem'
                      delivery:
                        type: object
                        nullable: true
                        properties:
                          delivery_by:
                            type: string
                            example: "FedEx"
                          speed:
                            type: string
                            example: "express"
                          tracking_number:
                            type: string
                            example: "1Z999AA10123456784"
        '401':
          description: Unauthorized - missing or invalid JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orders/admin/delivery:
    post:
      summary: Create or Update Delivery (Admin only)
      description: Create a new delivery record or update an existing one. If delivery_id is provided, updates the existing record. If not provided, creates a new record. No duplicate tracking number validation is performed.
      tags: [Orders]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                delivery_id:
                  type: string
                  description: Delivery ID to update (optional - if not provided, creates new record)
                  example: "507f1f77bcf86cd799439011"
                order_id:
                  type: string
                  description: Order ID this delivery belongs to
                  example: "507f1f77bcf86cd799439011"
                shipping_address_id:
                  type: string
                  description: Shipping address ID for delivery
                  example: "507f1f77bcf86cd799439011"
                delivery_by:
                  type: string
                  description: Shipping company name
                  example: "FedEx"
                speed:
                  type: string
                  enum: ['standard', 'normal', 'express', 'overnight', 'same_day', 'economy']
                  description: Delivery speed option
                  example: "express"
                tracking_number:
                  type: string
                  description: Parcel tracking number
                  example: "1Z999AA10123456784"
              required:
                - order_id
                - shipping_address_id
                - delivery_by
                - speed
                - tracking_number
            examples:
              createNew:
                summary: Create new delivery record
                value:
                  order_id: "507f1f77bcf86cd799439011"
                  shipping_address_id: "507f1f77bcf86cd799439011"
                  delivery_by: "FedEx"
                  speed: "express"
                  tracking_number: "1Z999AA10123456784"
              updateExisting:
                summary: Update existing delivery record
                value:
                  delivery_id: "507f1f77bcf86cd799439011"
                  order_id: "507f1f77bcf86cd799439011"
                  shipping_address_id: "507f1f77bcf86cd799439011"
                  delivery_by: "UPS"
                  speed: "overnight"
                  tracking_number: "1Z999AA10123456785"
      responses:
        '200':
          description: Delivery created or updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Delivery created successfully"
                  data:
                    type: object
                    properties:
                      delivery:
                        $ref: '#/components/schemas/Delivery'
        '400':
          description: Bad request - validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingFields:
                  summary: Missing required fields
                  value:
                    success: false
                    message: "Order ID, shipping address ID, delivery company, speed, and tracking number are required"
                orderNotFound:
                  summary: Order not found
                  value:
                    success: false
                    message: "Order not found"
                addressNotFound:
                  summary: Shipping address not found
                  value:
                    success: false
                    message: "Shipping address not found"
        '401':
          description: Unauthorized - missing or invalid JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Delivery record not found (when updating)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse' 