# Example Endpoints for E-Commerce Authentication API
# This file contains example routes demonstrating role-based access control

openapi: 3.0.0
info:
  title: E-Commerce Example Endpoints
  version: 1.0.0
  description: Example routes demonstrating role-based access control

tags:
  - name: Examples
    description: Example routes demonstrating role-based access control

paths:
  # ========================================
  # EXAMPLE ENDPOINTS
  # ========================================

  /api/example/user-content:
    get:
      summary: Access user content (both users and admins)
      description: This endpoint is accessible to both regular users and admin users. It demonstrates the 'user' role middleware which allows access to authenticated users of any role.
      tags: [Examples]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User content accessed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Operation success status
                    example: true
                  message:
                    type: string
                    description: Success message
                    example: "This content is accessible to both users and admins"
                  user:
                    $ref: '#/components/schemas/User'
              example:
                success: true
                message: "This content is accessible to both users and admins"
                user:
                  _id: "507f1f77bcf86cd799439011"
                  first_name: "John"
                  last_name: "Doe"
                  email: "john.doe@example.com"
                  mobile_number: null
                  is_admin: false
                  full_name: "John Doe"
                  created_at: "2024-01-15T10:30:00.000Z"
                  edited_at: "2024-01-15T10:30:00.000Z"
        '401':
          description: Unauthorized - missing or invalid JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingToken:
                  summary: Missing authorization token
                  value:
                    success: false
                    message: "Access token is required"
                invalidToken:
                  summary: Invalid token
                  value:
                    success: false
                    message: "Invalid token"
                expiredToken:
                  summary: Expired token
                  value:
                    success: false
                    message: "Token expired"
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Insufficient permissions"

  /api/example/admin-content:
    get:
      summary: Access admin-only content
      description: This endpoint is accessible only to admin users. It demonstrates the 'admin' role middleware which restricts access to users with admin privileges.
      tags: [Examples]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Admin content accessed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Operation success status
                    example: true
                  message:
                    type: string
                    description: Success message
                    example: "This content is accessible only to admins"
                  user:
                    $ref: '#/components/schemas/User'
              example:
                success: true
                message: "This content is accessible only to admins"
                user:
                  _id: "507f1f77bcf86cd799439011"
                  first_name: "Admin"
                  last_name: "User"
                  email: "admin@example.com"
                  mobile_number: null
                  is_admin: true
                  full_name: "Admin User"
                  created_at: "2024-01-15T10:30:00.000Z"
                  edited_at: "2024-01-15T10:30:00.000Z"
        '401':
          description: Unauthorized - missing or invalid JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingToken:
                  summary: Missing authorization token
                  value:
                    success: false
                    message: "Access token is required"
                invalidToken:
                  summary: Invalid token
                  value:
                    success: false
                    message: "Invalid token"
                expiredToken:
                  summary: Expired token
                  value:
                    success: false
                    message: "Token expired"
        '403':
          description: Forbidden - admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Admin access required"

  /api/example/public-content:
    get:
      summary: Access public content (both users and admins)
      description: This endpoint is accessible to both regular users and admin users. It's another example of the 'user' role middleware allowing access to authenticated users of any role.
      tags: [Examples]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Public content accessed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Operation success status
                    example: true
                  message:
                    type: string
                    description: Success message
                    example: "This content is accessible to authenticated users"
                  user:
                    $ref: '#/components/schemas/User'
              example:
                success: true
                message: "This content is accessible to authenticated users"
                user:
                  _id: "507f1f77bcf86cd799439011"
                  first_name: "John"
                  last_name: "Doe"
                  email: "john.doe@example.com"
                  mobile_number: null
                  is_admin: false
                  full_name: "John Doe"
                  created_at: "2024-01-15T10:30:00.000Z"
                  edited_at: "2024-01-15T10:30:00.000Z"
        '401':
          description: Unauthorized - missing or invalid JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingToken:
                  summary: Missing authorization token
                  value:
                    success: false
                    message: "Access token is required"
                invalidToken:
                  summary: Invalid token
                  value:
                    success: false
                    message: "Invalid token"
                expiredToken:
                  summary: Expired token
                  value:
                    success: false
                    message: "Token expired"
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Insufficient permissions" 