openapi: 3.0.0
info:
  title: E-Commerce Product Management API
  description: Admin-only APIs for managing products in the e-commerce system
  version: 1.0.0
  contact:
    name: E-Commerce Backend Team
    email: support@ecommerce.com

servers:
  - url: http://localhost:3000
    description: Development server
  - url: https://api.ecommerce.com
    description: Production server

tags:
  - name: Product Management
    description: Admin APIs for managing products, inventory, and reviews

paths:
  /api/products/admin/all:
    get:
      tags:
        - Product Management
      summary: Get All Products with Filters
      description: |
        Retrieve all products with advanced filtering, search, pagination, and sorting capabilities.
        Supports stock level filters, status filters, and search by name/SKU/category.
        Returns products with primary images for list display.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number for pagination
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: limit
          in: query
          description: Number of products per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
        - name: stock_filters
          in: query
          description: Stock level filters (can combine multiple)
          required: false
          schema:
            type: array
            items:
              type: string
              enum: ['in_stock', 'low_stock', 'out_of_stock']
            example: ['in_stock', 'low_stock']
          style: form
          explode: true
        - name: status_filters
          in: query
          description: Product status filters (can combine multiple)
          required: false
          schema:
            type: array
            items:
              type: string
              enum: ['published', 'draft']
            example: ['published']
          style: form
          explode: true
        - name: search
          in: query
          description: Search term for product name, SKU, or category ID
          required: false
          schema:
            type: string
            maxLength: 100
          example: "iphone"
        - name: sort_by
          in: query
          description: Field to sort by
          required: false
          schema:
            type: string
            enum: ['created_at', 'name', 'price', 'stock_quantity', 'sku']
            default: 'created_at'
          example: "created_at"
        - name: sort_order
          in: query
          description: Sort order
          required: false
          schema:
            type: string
            enum: ['asc', 'desc']
            default: 'desc'
          example: "desc"
      responses:
        '200':
          description: Products retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
              example:
                success: true
                data:
                  products:
                    - _id: "507f1f77bcf86cd799439011"
                      name: "iPhone 15 Pro"
                      sku: "IPHONE15PRO-256GB"
                      description: "Latest iPhone with advanced features"
                      product_description: "<p>Latest iPhone with <strong>advanced features</strong> and <em>titanium design</em></p><ul><li>48MP Main camera</li><li>A17 Pro chip</li><li>Titanium build</li></ul>"
                      price: 999.99
                      mrp: 1099.99
                      discount_type: null
                      discount_rate: 0
                      stock_quantity: 75
                      weight: 0.187
                      status: "published"
                      category_id:
                        _id: "507f1f77bcf86cd799439012"
                        name: "Electronics"
                      deleted_at: null
                      final_price: 999.99
                      discount_amount: 0
                      in_stock: true
                      low_stock: false
                      is_deleted: false
                      created_at: "2024-01-15T10:30:00.000Z"
                      edited_at: "2024-01-15T10:30:00.000Z"
                      primary_image:
                        _id: "507f1f77bcf86cd799439013"
                        product_id: "507f1f77bcf86cd799439011"
                        image_url: "/images/products/iphone15pro-1.jpg"
                        alt_text: "iPhone 15 Pro front view"
                        is_primary: true
                        sort_order: 1
                        created_at: "2024-01-15T10:30:00.000Z"
                        edited_at: "2024-01-15T10:30:00.000Z"
                      all_images:
                        - _id: "507f1f77bcf86cd799439013"
                          product_id: "507f1f77bcf86cd799439011"
                          image_url: "/images/products/iphone15pro-1.jpg"
                          alt_text: "iPhone 15 Pro front view"
                          is_primary: true
                          sort_order: 1
                          created_at: "2024-01-15T10:30:00.000Z"
                          edited_at: "2024-01-15T10:30:00.000Z"
                        - _id: "507f1f77bcf86cd799439014"
                          product_id: "507f1f77bcf86cd799439011"
                          image_url: "/images/products/iphone15pro-2.jpg"
                          alt_text: "iPhone 15 Pro back view"
                          is_primary: false
                          sort_order: 2
                          created_at: "2024-01-15T10:30:00.000Z"
                          edited_at: "2024-01-15T10:30:00.000Z"
                      variations:
                        - _id: "507f1f77bcf86cd799439015"
                          product_id: "507f1f77bcf86cd799439011"
                          color: "Space Black"
                          size: "256GB"
                          price: 999.99
                          stock_quantity: 25
                          sku: "IPHONE15PRO-256GB-BLK"
                          status: "active"
                          variation_name: "Space Black 256GB"
                          created_at: "2024-01-15T10:30:00.000Z"
                          updated_at: "2024-01-15T10:30:00.000Z"
                        - _id: "507f1f77bcf86cd799439016"
                          product_id: "507f1f77bcf86cd799439011"
                          color: "Natural Titanium"
                          size: "256GB"
                          price: 999.99
                          stock_quantity: 30
                          sku: "IPHONE15PRO-256GB-TIT"
                          status: "active"
                          variation_name: "Natural Titanium 256GB"
                          created_at: "2024-01-15T10:30:00.000Z"
                          updated_at: "2024-01-15T10:30:00.000Z"
                      review_overview:
                        average_rating: 4.5
                        total_reviews: 25
                  pagination:
                    current_page: 1
                    total_pages: 5
                    total_products: 100
                    limit: 20
                  filters:
                    stock_filters: ["in_stock", "low_stock"]
                    status_filters: ["published"]
                    search: "iphone"
                  sorting:
                    sort_by: "created_at"
                    sort_order: "desc"
        '401':
          description: Unauthorized - Admin authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/products/admin/add:
    post:
      tags:
        - Product Management
      summary: Add New Product
      description: |
        Create a new product with all required fields.
        Validates SKU uniqueness and category existence.
        Returns the created product with primary image.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreationRequest'
            example:
              name: "iPhone 15 Pro"
              sku: "IPHONE15PRO-256GB"
              description: "Latest iPhone with advanced features and titanium design"
              product_description: "<p>Latest iPhone with <strong>advanced features</strong> and <em>titanium design</em></p><ul><li>48MP Main camera</li><li>A17 Pro chip</li><li>Titanium build</li><li>Action Button</li></ul>"
              category_id: "507f1f77bcf86cd799439012"
              status: "draft"
              variations:
                - color: "Titanium"
                  size: "256GB"
                  sku: "IPHONE15PRO-TITANIUM-256"
                  price: 999.99
                  stock: 50
                  status: "active"
                - color: "Blue"
                  size: "256GB"
                  sku: "IPHONE15PRO-BLUE-256"
                  price: 999.99
                  stock: 30
                  status: "active"
              pricing:
                mrp: 1199.99
                price: 999.99
                discount_type: "percentage"
                discount_rate: 16.67
              stock_quantity: 80
              weight: 0.187
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCreationResponse'
              example:
                success: true
                message: "Product created successfully"
                data:
                  product:
                    _id: "507f1f77bcf86cd799439011"
                    name: "iPhone 15 Pro"
                    sku: "IPHONE15PRO-256GB"
                    description: "Latest iPhone with advanced features and titanium design"
                    product_description: "<p>Latest iPhone with <strong>advanced features</strong> and <em>titanium design</em></p><ul><li>48MP Main camera</li><li>A17 Pro chip</li><li>Titanium build</li><li>Action Button</li></ul>"
                    price: 999.99
                    mrp: 1199.99
                    discount_type: "percentage"
                    discount_rate: 16.67
                    stock_quantity: 80
                    weight: 0.187
                    status: "draft"
                    category_id:
                      _id: "507f1f77bcf86cd799439012"
                      name: "Electronics"
                    deleted_at: null
                    final_price: 999.99
                    discount_amount: 200.00
                    in_stock: true
                    low_stock: false
                    is_deleted: false
                    created_at: "2024-01-15T10:30:00.000Z"
                    edited_at: "2024-01-15T10:30:00.000Z"
                    primary_image: null
                  variations:
                    - _id: "507f1f77bcf86cd799439013"
                      product_id: "507f1f77bcf86cd799439011"
                      color: "Titanium"
                      size: "256GB"
                      price: 999.99
                      stock_quantity: 50
                      sku: "IPHONE15PRO-TITANIUM-256"
                      status: "active"
                      variation_name: "Titanium - 256GB"
                      created_at: "2024-01-15T10:30:00.000Z"
                      updated_at: "2024-01-15T10:30:00.000Z"
                    - _id: "507f1f77bcf86cd799439014"
                      product_id: "507f1f77bcf86cd799439011"
                      color: "Blue"
                      size: "256GB"
                      price: 999.99
                      stock_quantity: 30
                      sku: "IPHONE15PRO-BLUE-256"
                      status: "active"
                      variation_name: "Blue - 256GB"
                      created_at: "2024-01-15T10:30:00.000Z"
                      updated_at: "2024-01-15T10:30:00.000Z"
        '400':
          description: Bad request - validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Product with this SKU already exists"
        '401':
          description: Unauthorized - Admin authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/products/admin/edit/{productId}:
    put:
      tags:
        - Product Management
      summary: Edit Existing Product
      description: |
        Update an existing product. Only provided fields are updated.
        Unspecified fields remain unchanged.
        Validates SKU uniqueness and category existence if updated.
        Returns the updated product with primary image.
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          description: Product ID to update
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
          example: "507f1f77bcf86cd799439011"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
            example:
              name: "iPhone 15 Pro Max"
              price: 1099.99
              stock_quantity: 150
              status: "published"
      responses:
        '200':
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductUpdateResponse'
              example:
                success: true
                message: "Product updated successfully"
                data:
                  product:
                    _id: "507f1f77bcf86cd799439011"
                    name: "iPhone 15 Pro Max"
                    sku: "IPHONE15PRO-256GB"
                    description: "Latest iPhone with advanced features and titanium design"
                    product_description: "<p>Latest iPhone with <strong>advanced features</strong> and <em>titanium design</em></p><ul><li>48MP Main camera</li><li>A17 Pro chip</li><li>Titanium build</li><li>Action Button</li></ul>"
                    price: 1099.99
                    discount_type: null
                    discount_rate: 0
                    stock_quantity: 150
                    weight: 0.187
                    status: "published"
                    category_id:
                      _id: "507f1f77bcf86cd799439012"
                      name: "Electronics"
                    deleted_at: null
                    final_price: 1099.99
                    discount_amount: 0
                    in_stock: true
                    low_stock: false
                    is_deleted: false
                    created_at: "2024-01-15T10:30:00.000Z"
                    edited_at: "2024-01-15T10:30:00.000Z"
                    primary_image:
                      _id: "507f1f77bcf86cd799439013"
                      product_id: "507f1f77bcf86cd799439011"
                      image_url: "/images/products/iphone15pro-1.jpg"
                      alt_text: "iPhone 15 Pro front view"
                      is_primary: true
                      sort_order: 1
                      created_at: "2024-01-15T10:30:00.000Z"
                      edited_at: "2024-01-15T10:30:00.000Z"
        '400':
          description: Bad request - validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Product with this SKU already exists"
        '401':
          description: Unauthorized - Admin authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/products/admin/delete/{productId}:
    delete:
      tags:
        - Product Management
      summary: Soft Delete Product
      description: |
        Soft delete a product by setting deleted_at timestamp and status to 'deleted'.
        Soft-deleted products are excluded from all product queries.
        This operation is irreversible through this API.
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          description: Product ID to delete
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
          example: "507f1f77bcf86cd799439011"
      responses:
        '200':
          description: Product deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Product deleted successfully"
        '401':
          description: Unauthorized - Admin authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

