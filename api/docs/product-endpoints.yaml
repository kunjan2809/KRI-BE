  # Get Product Suggestions (Public API)
  /api/products/suggestions/{productId}:
    get:
      tags:
        - Products
      summary: Get product suggestions
      description: |
        Get up to 4 random product suggestions from the same category as the specified product.
        Returns products with their primary images, all images, variations, and review overviews.
        Excludes the current product from suggestions. Returns published, non-deleted products only.
        This is a public API that does not require authentication.
