  # Add Product Variation (Admin only)
  /api/products/admin/{productId}/variations:
    post:
      tags:
        - Products
      summary: Add product variation
      description: Add a new variation (color, size, price) to an existing product
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          description: Product ID
          schema:
            type: string
            example: "507f1f77bcf86cd799439011"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - color
                - size
                - price
              properties:
                color:
                  type: string
                  description: Variation color
                  maxLength: 50
                  example: "Black"
                size:
                  type: string
                  description: Variation size
                  maxLength: 20
                  example: "256GB"
                price:
                  type: number
                  description: Variation price
                  minimum: 0
                  example: 999.99
                stock_quantity:
                  type: integer
                  description: Stock quantity for this variation
                  minimum: 0
                  default: 0
                  example: 50
                sku:
                  type: string
                  description: Unique SKU for this variation
                  maxLength: 100
                  example: "IPHONE15PRO-BLACK-256"
                status:
                  type: string
                  enum: ['active', 'inactive']
                  description: Variation status
                  default: 'active'
                  example: "active"
            example:
              color: "Black"
              size: "256GB"
              price: 999.99
              stock_quantity: 50
              sku: "IPHONE15PRO-BLACK-256"
              status: "active"
      responses:
        '201':
          description: Product variation added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Product variation added successfully"
                  data:
                    type: object
                    properties:
                      variation:
                        $ref: '#/components/schemas/ProductVariation'
              example:
                success: true
                message: "Product variation added successfully"
                data:
                  variation:
                    _id: "507f1f77bcf86cd799439025"
                    product_id: "507f1f77bcf86cd799439011"
                    color: "Black"
                    size: "256GB"
