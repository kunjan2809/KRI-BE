  /api/products/admin/quantity/{productId}:
    patch:
      tags:
        - Product Management
      summary: Update Product Quantity
      description: |
        Update the stock quantity of a specific product.
        Only accepts positive integers (0 or greater).
        Returns the product ID and new quantity.
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          description: Product ID to update quantity
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
          example: "507f1f77bcf86cd799439011"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductQuantityUpdateRequest'
            example:
              quantity: 100
      responses:
        '200':
          description: Product quantity updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductQuantityUpdateResponse'
              example:
                success: true
                message: "Product quantity updated successfully"
                data:
                  product_id: "507f1f77bcf86cd799439011"
                  new_quantity: 100
        '400':
          description: Bad request - invalid quantity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Valid quantity is required (must be >= 0)"
        '401':
          description: Unauthorized - Admin authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/products/admin/status/{productId}:
    patch:
      tags:
        - Product Management
      summary: Change Product Status
      description: |
        Update the status of a specific product.
        Valid statuses: draft, published.
        Returns the product ID and new status.
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          description: Product ID to update status
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
          example: "507f1f77bcf86cd799439011"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductStatusUpdateRequest'
            example:
              status: "published"
      responses:
        '200':
          description: Product status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductStatusUpdateResponse'
              example:
                success: true
                message: "Product status updated successfully"
                data:
                  product_id: "507f1f77bcf86cd799439011"
                  new_status: "published"
        '400':
          description: Bad request - invalid status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Valid status is required (draft or published)"
        '401':
          description: Unauthorized - Admin authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Get Featured Products (Public API)
  /api/products/featured:
    get:
      tags:
        - Products
      summary: Get featured products
      description: |
        Returns up to 12 featured products. If there are fewer than 12 featured products,
        the remaining slots are filled with random published products.
        This is a public API with optional authentication for wishlist status.
      parameters:
        - name: include_wishlist_status
