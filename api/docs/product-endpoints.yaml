  # Get All Products (Public API)
  /api/products/all:
    get:
      tags:
        - Products
      summary: Get all products with filters and sorting
      description: |
        Get all products with multiple criteria including price range, color, size, category, and sorting options.
        This is a public API that does not require authentication.
        Search prioritizes product name matches over description matches for better relevance.
      parameters:
        - name: search
          in: query
          description: Search term to match against product name, description, and category name
          required: false
          schema:
            type: string
            example: "iPhone"
        - name: min_price
          in: query
          description: Minimum price filter
          required: false
          schema:
            type: number
            minimum: 0
            example: 100
        - name: max_price
          in: query
          description: Maximum price filter
          required: false
          schema:
            type: number
            minimum: 0
            example: 1000
        - name: color
          in: query
          description: Filter by exact product variation color match
          required: false
          schema:
            type: string
            example: "Black"
        - name: size
          in: query
          description: Filter by exact product variation size match
          required: false
          schema:
            type: string
            example: "256GB"
        - name: category_id
          in: query
          description: Filter by category ID
          required: false
          schema:
            type: string
            example: "507f1f77bcf86cd799439012"
        - name: newest_first
          in: query
          description: Sort by newest products first
          required: false
          schema:
            type: boolean
            example: true
        - name: price_sort
          in: query
          description: Sort by price (low_to_high or high_to_low)
          required: false
          schema:
            type: string
            enum: ['low_to_high', 'high_to_low']
            example: "low_to_high"
        - name: highest_rated
          in: query
          description: Sort by highest rated products first
          required: false
          schema:
            type: boolean
            example: true
        - name: page
          in: query
          description: Page number for pagination
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - name: limit
          in: query
          description: Number of products per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            example: 20
        - name: include_wishlist_status
          in: query
          description: Include wishlist status for authenticated users (requires Bearer token)
          required: false
          schema:
            type: boolean
            default: false
            example: true
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Products retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      products:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/Product'
                            - type: object
                              properties:
                                category_name:
                                  type: string
                                  example: "Electronics"
                                average_rating:
                                  type: number
                                  example: 4.5
                                total_reviews:
                                  type: integer
                                  example: 128
                                available_colors:
                                  type: array
                                  items:
                                    type: string
                                  example: ["Black", "White", "Blue"]
                                available_sizes:
                                  type: array
